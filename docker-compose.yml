services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sales-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesai_password}
      POSTGRES_DB: ${POSTGRES_DB:-salesai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-salesai} -d $${POSTGRES_DB:-salesai_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales-ai-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sales-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales-ai-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    container_name: sales-ai-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-salesai}:${POSTGRES_PASSWORD:-salesai_password}@postgres:5432/${POSTGRES_DB:-salesai_db}
      
      # Redis Configuration
      REDIS_URL: redis://redis:6379/0
      
      # Application Settings
      ENVIRONMENT: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://frontend:3000"]'
      
      # Knowledge Base
      KNOWLEDGE_BASE_PATH: /app/knowledge_base
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/knowledge_base:/app/knowledge_base
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales-ai-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    container_name: sales-ai-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_API_TOKEN: ${VITE_API_TOKEN:-}
    ports:
      - "5173:5173"
    networks:
      - sales-ai-network

volumes:
  postgres_data:
  redis_data:

networks:
  sales-ai-network:
    driver: bridge
